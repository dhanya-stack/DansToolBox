<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pump Power — Workbench</title><style>
:root{--ink:#17211b;--muted:#657068;--paper:#f4f1e9;--card:#fffdf8;--line:#d9d6cc;--green:#315c45;--rust:#a85f3d;--gold:#c6a15b;--blue:#46647a;--shadow:0 14px 40px rgba(34,40,35,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:24px;font-weight:700;text-decoration:none}.brand span{color:var(--rust)}nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}nav a{text-decoration:none}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:700;color:var(--green)}h1,h2,h3{font-family:Georgia,serif}.hero{padding:60px 0 40px}.hero h1{font-size:clamp(42px,6vw,72px);line-height:1;letter-spacing:-.035em;margin:12px 0 18px}.lead{font-size:18px;line-height:1.65;color:var(--muted);max-width:760px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white;font-size:16px}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:12px 16px;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:18px;border-left:3px solid var(--gold);background:#f8f5ed;line-height:1.6}.big{font:700 32px Georgia,serif;color:var(--green)}.small{font-size:13px;color:var(--muted);line-height:1.55}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:white;cursor:pointer}.chip.active{background:var(--ink);color:white}.list{display:grid;gap:10px}.row{padding:14px;border:1px solid var(--line);border-radius:10px;background:white}.back{display:inline-block;margin-top:24px;color:var(--green);font-weight:700;text-decoration:none}footer{margin-top:50px;border-top:1px solid var(--line);padding:28px 0 45px;color:var(--muted);font-size:13px}@media(max-width:700px){nav{display:none}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><a class="brand" href="../index.html">Work<span>bench</span></a><nav><a href="../index.html#tools">All tools</a><a href="../index.html">Home</a></nav></header><section class="hero"><div class="eyebrow">Engineering</div><h1>Pump Power</h1><p class="lead">Connect flow, head, density and efficiency to hydraulic and shaft power.</p></section><div class="panel"><div class="grid"><div class="field"><label>Flow L/s</label><input id="Q" type="number" value="10"></div><div class="field"><label>Head m</label><input id="H" type="number" value="25"></div><div class="field"><label>Density kg/m³</label><input id="rho" type="number" value="998"></div><div class="field"><label>Efficiency %</label><input id="eta" type="number" value="70"></div></div><div id="out" class="result"></div></div><a class="back" href="../index.html">← Back to Workbench</a><footer>Educational tool. Check important financial, health and engineering decisions against appropriate professional guidance and source standards.</footer></div><script>function go(){let q=+Q.value/1000,h=+H.value,r=+rho.value,e=(+eta.value||1)/100,hyd=r*9.80665*q*h/1000,shaft=hyd/e;out.innerHTML=`<div class="big">${shaft.toFixed(2)} kW shaft power</div>Hydraulic power: <b>${hyd.toFixed(2)} kW</b>`}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',go));go();</script></body></html>
