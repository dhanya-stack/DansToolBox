<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Income Projector — Workbench</title><style>body{font-family:system-ui;margin:0;background:#f4f1e9;color:#17211b}.w{max-width:850px;margin:auto;padding:30px 22px}a{color:#315c45}.box{background:#fffdf8;border:1px solid #d9d6cc;border-radius:14px;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{font-size:13px;color:#657068}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}.result{font:700 34px Georgia,serif;margin:28px 0 8px}.muted{color:#657068;line-height:1.5}table{width:100%;border-collapse:collapse;margin-top:22px}th,td{text-align:right;padding:9px;border-bottom:1px solid #ddd}th:first-child,td:first-child{text-align:left}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="../index.html">← Workbench</a><h1>Rental Income Projector</h1><p class="muted">Project gross rent over time with an annual rent increase.</p><section class="box"><div class="grid"><label>Properties<input id="units" type="number" value="1" min="1" max="100"></label><label>Monthly rent per property (₹)<input id="rent" type="number" value="15000" min="0"></label><label>Annual increase (%)<input id="growth" type="number" value="5" min="0" max="30" step="0.1"></label><label>Years<input id="years" type="number" value="10" min="1" max="50"></label></div><div class="result" id="total"></div><div class="muted">Projected cumulative gross rent, before vacancy, maintenance, tax and other costs.</div><div id="table"></div></section></main><script>function calc(){let u=+units.value,r=+rent.value,g=+growth.value/100,y=Math.max(1,Math.min(50,+years.value||1)),sum=0,rows='';for(let i=1;i<=y;i++){let annual=r*u*12;sum+=annual;if(i<=10||i===y)rows+=`<tr><td>${i}</td><td>₹${Math.round(r).toLocaleString('en-IN')}</td><td>₹${Math.round(annual).toLocaleString('en-IN')}</td><td>₹${Math.round(sum).toLocaleString('en-IN')}</td></tr>`;r*=1+g}total.textContent='₹'+Math.round(sum).toLocaleString('en-IN');table.innerHTML=`<table><thead><tr><th>Year</th><th>Monthly / unit</th><th>Annual</th><th>Cumulative</th></tr></thead><tbody>${rows}</tbody></table>`}['units','rent','growth','years'].forEach(x=>document.getElementById(x).addEventListener('input',calc));calc();</script></body></html>
