<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Target Wealth Calculator — Workbench</title><style>body{font-family:system-ui;margin:0;background:#f4f1e9;color:#17211b}.w{max-width:850px;margin:auto;padding:30px 22px}a{color:#315c45}.box{background:#fffdf8;border:1px solid #d9d6cc;border-radius:14px;padding:24px;margin-top:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{font-size:13px;color:#657068}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}.result{font:700 34px Georgia,serif;margin:28px 0 8px}.muted{color:#657068;line-height:1.5}.bar{height:12px;background:#ddd8ce;border-radius:20px;overflow:hidden;margin-top:24px}.fill{height:100%;background:#315c45;width:0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="../index.html">← Workbench</a><h1>Target Wealth Calculator</h1><p class="muted">How long could regular investing take to reach your target? Change the assumptions and compare.</p><section class="box"><div class="grid"><label>Starting amount (₹)<input id="start" type="number" value="100000" min="0"></label><label>Monthly contribution (₹)<input id="monthly" type="number" value="25000" min="0"></label><label>Target (₹)<input id="target" type="number" value="10000000" min="1"></label><label>Assumed annual return (%)<input id="rate" type="number" value="8" min="0" max="50" step="0.1"></label></div><div class="result" id="result"></div><div class="muted" id="detail"></div><div class="bar"><div class="fill" id="fill"></div></div><p class="muted"><small>This is a mathematical projection, not an investment-return promise. It ignores tax, fees and inflation.</small></p></section></main><script>const ids=['start','monthly','target','rate'];function calc(){let b=+start.value,m=+monthly.value,t=+target.value,r=+rate.value/1200,months=0,contrib=b;if(t<=0||b<0||m<0||r<0){result.textContent='Check your inputs';return}while(b<t&&months<1200){b=b*(1+r)+m;contrib+=m;months++}if(months>=1200&&b<t){result.textContent='More than 100 years';detail.textContent='Try a larger contribution or different assumption.';return}const y=Math.floor(months/12),mo=months%12;result.textContent=`${y} years${mo?' '+mo+' months':''}`;detail.textContent=`Projected balance: ₹${Math.round(b).toLocaleString('en-IN')} · Contributions: ₹${Math.round(contrib).toLocaleString('en-IN')} · Growth: ₹${Math.max(0,Math.round(b-contrib)).toLocaleString('en-IN')}`;fill.style.width=Math.min(100,(+start.value/t)*100)+'%'}ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));calc();</script></body></html>
